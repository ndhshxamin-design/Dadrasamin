<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>آزمون دادرس | محمد امین دشتبان</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  :root {
    --ink: #F2F0EC;
    --cross: #E22440;
    --cross-deep: #A3122A;
    --cross-bright: #FF3355;
    --crescent: #E22440;
    --crescent-deep: #A3122A;
    --gold: #F2F0EC;
    --gold-soft: #2A2A2E;
    --sand: #0A0A0C;
    --sand-deep: #141416;
    --card: #17171A;
    --muted: #9C9994;
    --border: #2B2A2C;
    --good: #E22440;
    --goodBg: #2A1216;
    --bad: #FF3355;
    --badBg: #2A1216;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.3);
    --shadow-md: 0 10px 28px -10px rgba(226,36,64,0.35), 0 2px 10px rgba(0,0,0,0.5);
    --shadow-lg: 0 24px 56px -18px rgba(226,36,64,0.45), 0 6px 18px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 520px at 85% -8%, rgba(226,36,64,0.14), transparent 60%),
      radial-gradient(900px 460px at -5% 0%, rgba(226,36,64,0.08), transparent 55%),
      var(--sand);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    direction: rtl;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .screen { min-height: 100vh; padding: 28px 16px 64px; }
  .wrap { max-width: 780px; margin: 0 auto; animation: fadeUp .45s cubic-bezier(.2,.7,.3,1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; }
    * { transition: none !important; animation: none !important; }
  }

  .brand-banner {
    text-align: center; padding: 10px 14px 22px; margin-bottom: 6px;
  }
  .brand-banner .brand-name {
    font-size: 26px; font-weight: 900; letter-spacing: -0.01em;
    background: linear-gradient(90deg, #fff, var(--cross-bright), #fff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background-size: 200% auto; animation: sheen 5s linear infinite;
  }
  @keyframes sheen { to { background-position: 200% center; } }
  .brand-banner .brand-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0.02em;
  }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; flex-wrap: wrap; }
  .topbar h1 {
    font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar h1::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--cross-bright);
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(226,36,64,0.8);
  }
  button { font-family: inherit; cursor: pointer; }
  .btn-back {
    border: 1.5px solid var(--border); background: var(--card); border-radius: 10px;
    padding: 8px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink);
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .btn-back:hover { border-color: var(--crescent); transform: translateX(2px); }
  .btn-back:active { transform: scale(0.97); }

  .btn {
    border: none; border-radius: 13px; padding: 15px 22px; font-size: 15.5px; font-weight: 700;
    transition: transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .15s ease, filter .15s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary {
    background: linear-gradient(155deg, var(--cross), var(--cross-deep));
    color: #fff; box-shadow: 0 10px 24px -10px rgba(226,36,64,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 14px 28px -10px rgba(226,36,64,0.7); }
  .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.985); }
  .btn-secondary {
    background: var(--card); color: var(--ink); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--crescent); color: var(--crescent-deep); }
  .btn-danger { background: linear-gradient(155deg, var(--cross), var(--cross-deep)); color: #fff; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

  .card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 20px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease;
    position: relative;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--cross); }
  .card:active { transform: translateY(-1px); }
  .card-icon {
    font-size: 26px; width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(155deg, var(--sand-deep), var(--card));
    border: 1px solid var(--border);
  }
  .card-title { font-size: 16.5px; font-weight: 800; letter-spacing: -0.01em; }
  .card-desc { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.6; }

  input, select {
    width: 100%; padding: 13px 15px; border-radius: 11px; border: 1.5px solid var(--border);
    font-size: 15px; font-family: inherit; box-sizing: border-box; direction: rtl;
    background: var(--card); color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--cross); box-shadow: 0 0 0 4px rgba(226,36,64,0.18);
  }
  input::placeholder { color: #625F60; }
  select { color-scheme: dark; }
  option { background: var(--card); color: var(--ink); }

  .hero-circle {
    width: 84px; height: 84px; border-radius: 50%;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 55%),
      linear-gradient(155deg, var(--cross), var(--cross-deep));
    margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
    font-size: 38px; color: #fff; font-weight: 900;
    box-shadow: 0 16px 32px -12px rgba(226,36,64,0.65), 0 0 0 6px rgba(226,36,64,0.12);
    position: relative;
  }
  .hero-circle::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    border: 1.5px dashed rgba(226,36,64,0.35);
  }
  .home-title { text-align: center; margin-bottom: 44px; margin-top: 26px; }
  .home-title h1 { font-size: 30px; font-weight: 900; margin: 0 0 10px; letter-spacing: -0.02em; }
  .home-title h1::before { content: none; }
  .home-title p { color: var(--muted); font-size: 15px; margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .hidden { display: none !important; }

  .qcard {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
    padding: 18px 18px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    transition: box-shadow .18s ease, border-color .18s ease;
    direction: rtl; text-align: right;
  }
  .qcard:hover { box-shadow: var(--shadow-md); border-color: #3A2226; }
  .qchapter {
    font-size: 11.5px; color: var(--cross-bright); margin-bottom: 8px; font-weight: 700;
    display: inline-flex; padding: 3px 10px; border-radius: 20px; background: var(--goodBg);
    border: 1px solid rgba(226,36,64,0.25);
  }
  .qtext { font-size: 15px; font-weight: 700; margin-bottom: 14px; line-height: 1.8; direction: rtl; text-align: right; }

  .opt-row {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px;
    border-radius: 11px; border: 1.5px solid var(--border); cursor: pointer; font-size: 14px; margin-bottom: 8px;
    transition: border-color .15s ease, background .15s ease;
    direction: rtl; text-align: right;
  }
  .opt-row:hover { border-color: var(--cross); }
  .opt-row input[type="radio"] { flex-shrink: 0; width: 18px; height: 18px; margin: 0; }
  .opt-letter {
    font-weight: 800; color: var(--muted); width: 22px; height: 22px; border-radius: 6px;
    background: var(--sand-deep); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
  }
  .filter-chip {
    padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 13px; margin-left: 8px; font-weight: 600;
    transition: all .15s ease; display: inline-block; margin-bottom: 8px;
  }
  .filter-chip:hover { border-color: var(--cross); }
  .filter-chip.active {
    background: linear-gradient(155deg, var(--cross), var(--cross-deep)); color: #fff; border-color: transparent;
    box-shadow: 0 6px 14px -6px rgba(226,36,64,0.5);
  }

  .progressbar { height: 8px; background: var(--sand-deep); border-radius: 4px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); }
  .progressbar-fill {
    height: 100%; border-radius: 4px; transition: width 0.35s cubic-bezier(.2,.7,.3,1);
    background: linear-gradient(90deg, var(--cross-deep), var(--cross-bright));
  }
  .quiz-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; align-items: center; font-weight: 600; }
  .timer-badge { font-weight: 800; font-size: 14px; padding: 5px 12px; border-radius: 9px; font-variant-numeric: tabular-nums; }

  .option-box {
    display: flex; align-items: center; gap: 13px; padding: 15px 17px; border-radius: 13px;
    border: 2px solid var(--border); background: var(--card); cursor: pointer; font-size: 15px;
    line-height: 1.7; margin-bottom: 10px; box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, background .15s ease, transform .12s ease, box-shadow .15s ease;
    direction: rtl; text-align: right;
  }
  .option-box:hover { border-color: var(--cross-deep); transform: translateX(-2px); }
  .option-box.selected { border-color: var(--cross); background: var(--goodBg); box-shadow: 0 6px 16px -8px rgba(226,36,64,0.45); }
  .option-letter-circle {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--sand-deep); border: 1.5px solid var(--border); font-size: 13px; font-weight: 800; flex-shrink: 0;
    transition: all .15s ease;
  }
  .option-letter-circle.selected { background: linear-gradient(155deg, var(--cross), var(--cross-deep)); color: #fff; border-color: transparent; }

  .result-circle {
    width: 108px; height: 108px; border-radius: 50%; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff;
    box-shadow: var(--shadow-lg);
    position: relative;
  }
  .result-circle::after {
    content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0.18;
  }

  .loading { text-align: center; padding: 100px 0; color: var(--muted); font-weight: 600; }
  .error-text { color: var(--bad); font-size: 13px; margin-top: 8px; }

  .tab-row { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab-btn {
    padding: 9px 18px; border-radius: 20px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--ink); font-size: 13px; font-weight: 700;
    transition: all .15s ease; box-shadow: var(--shadow-sm);
  }
  .tab-btn:hover { border-color: var(--cross); }
  .tab-btn.active {
    background: linear-gradient(155deg, var(--cross), var(--cross-deep)); color: #fff; border-color: transparent;
    box-shadow: 0 6px 14px -6px rgba(226,36,64,0.5);
  }

  .stat-card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 20px 20px; flex: 1; display: flex; flex-direction: column; align-items: flex-start;
    gap: 5px; min-width: 130px; box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat-value { font-size: 25px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat-sub { font-size: 11px; color: var(--muted); }
  .flex-wrap-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  :focus-visible { outline: 2.5px solid var(--cross); outline-offset: 2px; }
</style>
</head>

<script>
/* ====================== QUESTION BANK ====================== */

const STORAGE_PREFIX = 'quiz_dadras_';

async function apiGet(key) {
  try {
    const value = localStorage.getItem(STORAGE_PREFIX + key);
    return value; // localStorage خودش null برمی‌گرداند اگر نبود
  } catch (e) {
    console.error('خطا در خواندن از حافظه مرورگر', e);
    return null;
  }
}

async function apiSet(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, value);
    return { ok: true };
  } catch (e) {
    console.error('خطا در ذخیره‌سازی در حافظه مرورگر', e);
    throw e;
  }
}

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ====================== INITIAL LOAD ====================== */
async function init() {
  try {
    const ak = await apiGet('answerKey');
    if (ak) state.answerKey = { ...DEFAULT_ANSWER_KEY, ...JSON.parse(ak) };
  } catch (e) { console.error(e); }
  try {
    const rs = await apiGet('results');
    if (rs) state.results = JSON.parse(rs);
  } catch (e) { console.error(e); }
  try {
    const ql = await apiGet('quizLength');
    if (ql) state.quizLength = parseInt(ql, 10) || 20;
  } catch (e) { console.error(e); }
  try {
    const tl = await apiGet('timeLimit');
    if (tl) state.timeLimit = parseInt(tl, 10) || 0;
  } catch (e) { console.error(e); }
  goto('home');
}

/* ====================== RENDER ROUTER ====================== */
function render() {
  switch (state.screen) {
    case 'loading': return renderLoading();
    case 'home': return renderHome();
    case 'adminLogin': return renderAdminLogin();
    case 'adminPanel': return renderAdminPanel();
    case 'stats': return renderStats();
    case 'student': return renderStudentStart();
    case 'quiz': return renderQuiz();
    case 'result': return renderResult();
    default: return renderHome();
  }
}

function screenShell(innerHtml) {
  app.innerHTML = `<div class="screen"><div class="wrap">${innerHtml}</div></div>`;
}

function topBar(title, backScreen) {

}

}

function setAdminFilter(f) { state.adminFilter = f; render(); }
function setAdminChapterFilter(c) { state.adminChapterFilter = c; render(); }

async function setAnswer(qid, idx) {
  state.answerKey = { ...state.answerKey, [qid]: idx };
  render();
  const indicator = document.getElementById('savingIndicator');
  if (indicator) indicator.textContent = 'در حال ذخیره…';

    await apiSet('answerKey', JSON.stringify(state.answerKey));

}

  const input = document.getElementById('timeLimitInput');
  const n = Math.max(0, Math.min(600, parseInt(input.value, 10) || 0));

  render();
  try { await apiSet('timeLimit', String(n)); } catch (e) { console.error(e); }
}

/* ====================== STUDENT START ====================== */
function renderStudentStart() {
  const readyCount = Object.keys(state.answerKey).length;
  const canStart = readyCount >= 4;
  const actualCount = Math.min(state.quizLength, readyCount);

  screenShell(`
    ${topBar('شرکت در آزمون', 'home')}
    <div class="card" style="display:block; cursor:default;">
      <label style="font-size:14px; font-weight:700; display:block; margin-bottom:8px;">نام و نام خانوادگی</label>

          ⏱ این آزمون ${state.timeLimit} دقیقه مهلت دارد. بعد از شروع، تایمر فعال می‌شود.
        </div>` : ''}
      ${!canStart ? `
        <div style="margin-top:14px; font-size:13px; color:var(--bad); line-height:1.8;">
          هنوز معلم پاسخ کافی برای سوالات مشخص نکرده است. لطفاً بعداً دوباره تلاش کنید.
        </div>` : ''}
      <div style="margin-top:18px;">
        <button class="btn btn-primary" id="startBtn" ${!canStart ? 'disabled' : ''} onclick="handleStartQuiz()">
          شروع آزمون (${actualCount} سوال)
        </button>
      </div>
    </div>
  `);

  const nameInput = document.getElementById('studentNameInput');
  const startBtn = document.getElementById('startBtn');
  nameInput.addEventListener('input', () => {
    startBtn.disabled = !nameInput.value.trim() || !canStart;
  });
  startBtn.disabled = !nameInput.value.trim() || !canStart;
}

function handleStartQuiz() {
  const name = document.getElementById('studentNameInput').value.trim();
  if (!name) return;
  state.studentName = name;

  const eligible = QUESTIONS.filter(q => state.answerKey[q.id] !== undefined);
  const count = Math.min(state.quizLength, eligible.length);
  state.quizQuestions = shuffle(eligible).slice(0, count);
  state.quizAnswers = {};
  state.quizCurrent = 0;
  state.quizAutoSubmitted = false;
  state.quizSecondsLeft = state.timeLimit > 0 ? state.timeLimit * 60 : null;

  goto('quiz');
  startQuizTimer();
}

/* ====================== QUIZ ====================== */
function startQuizTimer() {
  if (state.quizTimerHandle) clearInterval(state.quizTimerHandle);
  if (state.quizSecondsLeft === null) return;

  state.quizTimerHandle = setInterval(() => {
    if (state.quizSecondsLeft === null) return;
    state.quizSecondsLeft -= 1;
    if (state.quizSecondsLeft <= 0) {
      clearInterval(state.quizTimerHandle);
      if (!state.quizAutoSubmitted) {
        state.quizAutoSubmitted = true;
        finishQuiz();
      }
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timerBadge');
  if (!el || state.quizSecondsLeft === null) return;
  const m = Math.floor(state.quizSecondsLeft / 60);
  const s = state.quizSecondsLeft % 60;
  const warning = state.quizSecondsLeft <= 60;
  el.textContent = `⏱ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  el.style.color = warning ? 'var(--bad)' : 'var(--crescent)';
  el.style.background = warning ? 'var(--badBg)' : 'var(--goodBg)';
}

function renderQuiz() {
  const q = state.quizQuestions[state.quizCurrent];
  if (!q) return renderHome();
  const isLast = state.quizCurrent === state.quizQuestions.length - 1;
  const chosen = state.quizAnswers[q.id];

  let timerHtml = '';
  if (state.quizSecondsLeft !== null) {
    const m = Math.floor(state.quizSecondsLeft / 60);
    const s = state.quizSecondsLeft % 60;
    const warning = state.quizSecondsLeft <= 60;
    timerHtml = `<span id="timerBadge" class="timer-badge" style="color:${warning ? 'var(--bad)' : 'var(--crescent)'}; background:${warning ? 'var(--badBg)' : 'var(--goodBg)'};">⏱ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}</span>`;
  }

  screenShell(`
    <div style="margin-bottom:16px;">
      <div class="quiz-meta">
        <span>${esc(state.studentName)}</span>
        <span>سوال ${state.quizCurrent + 1} از ${state.quizQuestions.length}</span>
        ${timerHtml}
      </div>
      <div class="progressbar">
        <div class="progressbar-fill" style="width:${((state.quizCurrent + 1) / state.quizQuestions.length) * 100}%;"></div>
      </div>
    </div>

    <div class="card" style="display:block; cursor:default; margin-bottom:20px;">
      <div class="qchapter">${esc(q.chapter)}</div>
      <div style="font-size:17px; font-weight:800; line-height:1.8; margin-bottom:20px;">${esc(q.question)}</div>
      <div>
        ${q.options.map((opt, idx) => `
          <div class="option-box ${chosen === idx ? 'selected' : ''}" onclick="selectQuizOption('${q.id}', ${idx})">
            <span class="option-letter-circle ${chosen === idx ? 'selected' : ''}">${LETTERS[idx]}</span>
            <span style="flex:1; min-width:0;">${esc(opt)}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <button class="btn btn-primary" id="nextBtn" style="width:100%;" ${chosen === undefined ? 'disabled' : ''} onclick="nextQuizQuestion()">
      ${isLast ? 'پایان آزمون' : 'سوال بعدی'}
    </button>
  `);
}

function selectQuizOption(qid, idx) {
  state.quizAnswers = { ...state.quizAnswers, [qid]: idx };
  render();
}

function nextQuizQuestion() {
  const isLast = state.quizCurrent === state.quizQuestions.length - 1;
  if (isLast) {
    if (state.quizTimerHandle) clearInterval(state.quizTimerHandle);
    finishQuiz();
  } else {
    state.quizCurrent += 1;
    render();
  }
}

async function finishQuiz() {
  let score = 0;
  const perQuestion = [];
  const withCorrect = state.quizQuestions.map(q => {
    const correctIdx = state.answerKey[q.id];
    const chosenIdx = state.quizAnswers[q.id];
    const correct = chosenIdx === correctIdx;
    if (correct) score++;
    perQuestion.push({ qid: q.id, chosenIdx, correct });
    return { ...q, _correctIdx: correctIdx };
  });

  const timestamp = Date.now();
  state.lastResult = {
    studentName: state.studentName,
    score,
    total: state.quizQuestions.length,
    quizQuestions: withCorrect,
    answers: state.quizAnswers,
    timestamp,
  };

  const newResults = [...state.results, {
    studentName: state.studentName,
    score,
    total: state.quizQuestions.length,
    timestamp,
    perQuestion,
  }];
  state.results = newResults;
  try {
    await apiSet('results', JSON.stringify(newResults));
  } catch (e) { console.error(e); }

  goto('result');
}

/* ====================== RESULT ====================== */
function renderResult() {
  const r = state.lastResult;
  if (!r) return renderHome();
  const percent = Math.round((r.score / r.total) * 100);

  screenShell(`
    <div style="text-align:center; margin-bottom:24px; margin-top:10px;">
      <div class="result-circle" style="background:${percent >= 50 ? 'var(--good)' : 'var(--bad)'};">${percent}%</div>
      <h2 style="font-size:20px; font-weight:800; margin:0 0 6px;">${esc(r.studentName)} عزیز</h2>
      <p style="color:var(--muted); font-size:15px; margin:0;">نمره شما: ${r.score} از ${r.total}</p>
    </div>
    <div style="margin-bottom:24px;">
      ${r.quizQuestions.map((q, i) => renderResultQuestion(q, i, r.answers)).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="goto('home')">بازگشت به صفحه اصلی</button>
  `);
}

function renderResultQuestion(q, i, answers) {
  const userAns = answers[q.id];
  const correctIdx = q._correctIdx;
  const isCorrect = userAns === correctIdx;
  return `
    <div class="qcard" style="border-color:${isCorrect ? '#3A2226' : '#5A1A24'}; border-width:1.5px; ${!isCorrect ? 'box-shadow:0 0 0 1px rgba(255,51,85,0.15);' : ''}">
      <div style="display:flex; gap:8px; align-items:flex-start; margin-bottom:10px;">
        <span style="font-size:18px;">${isCorrect ? '✅' : '❌'}</span>
        <div style="font-size:14px; font-weight:700; line-height:1.7;">${i + 1}. ${esc(q.question)}</div>
      </div>
      <div style="font-size:13px; color:var(--muted); margin-right:26px;">
        پاسخ شما: ${userAns !== undefined ? `${LETTERS[userAns]} - ${esc(q.options[userAns])}` : '—'}
      </div>
      ${!isCorrect ? `
        <div style="font-size:13px; color:var(--good); margin-right:26px; margin-top:4px;">
          پاسخ صحیح: ${LETTERS[correctIdx]} - ${esc(q.options[correctIdx])}
        </div>` : ''}
    </div>
  `;
}

/* ====================== STATS ====================== */
function renderStats() {
  const results = state.results;
  const answerKey = state.answerKey;
  const n = results.length;
  const avgPercent = n ? results.reduce((s, r) => s + (r.score / r.total) * 100, 0) / n : 0;
  const bestPercent = n ? Math.max(...results.map(r => (r.score / r.total) * 100)) : 0;
  const worstPercent = n ? Math.min(...results.map(r => (r.score / r.total) * 100)) : 0;
  const passCount = results.filter(r => (r.score / r.total) * 100 >= 50).length;

  screenShell(`
    ${topBar('آمار کامل آزمون', 'adminPanel')}
    <div class="tab-row">
      ${[['overview','نمای کلی'],['compare','مقایسه دانش‌آموزان'],['students','جزئیات هرکس'],['questions','سوالات پرخطا']].map(([key,label]) => `
        <button class="tab-btn ${state.statsTab === key ? 'active' : ''}" onclick="setStatsTab('${key}')">${label}</button>
      `).join('')}
    </div>
    <div id="statsContent"></div>
  `);

  const container = document.getElementById('statsContent');
  if (state.statsTab === 'overview') {
    container.innerHTML = renderStatsOverview(results, answerKey, n, avgPercent, bestPercent, worstPercent, passCount);
    renderProgressChart(results, avgPercent);
  } else if (state.statsTab === 'compare') {
    container.innerHTML = renderStatsCompare(results, avgPercent);
  } else if (state.statsTab === 'students') {
    container.innerHTML = renderStatsStudents(results, answerKey, avgPercent);
  } else if (state.statsTab === 'questions') {
    container.innerHTML = renderStatsQuestions(results);
  }
}

function setStatsTab(tab) { state.statsTab = tab; render(); }

function renderStatsOverview(results, answerKey, n, avgPercent, bestPercent, worstPercent, passCount) {
  return `
    <div class="flex-wrap-row">
      <div class="stat-card"><div class="stat-label">تعداد آزمون‌های انجام‌شده</div><div class="stat-value">${n}</div></div>
      <div class="stat-card"><div class="stat-label">میانگین کل نمرات</div><div class="stat-value">${avgPercent.toFixed(1)}%</div></div>
      <div class="stat-card">
        <div class="stat-label">درصد قبولی (≥۵۰٪)</div>
        <div class="stat-value">${n ? Math.round((passCount / n) * 100) + '%' : '—'}</div>
        <div class="stat-sub">${passCount} از ${n} آزمون</div>
      </div>
    </div>
    <div class="flex-wrap-row">
      <div class="stat-card"><div class="stat-label">بهترین نمره</div><div class="stat-value">${n ? bestPercent.toFixed(0) + '%' : '—'}</div></div>
      <div class="stat-card"><div class="stat-label">ضعیف‌ترین نمره</div><div class="stat-value">${n ? worstPercent.toFixed(0) + '%' : '—'}</div></div>
      <div class="stat-card"><div class="stat-label">سوالات دارای پاسخ</div><div class="stat-value">${Object.keys(answerKey).length}/${QUESTIONS.length}</div></div>
    </div>
    <div id="progressChartWrap"></div>
  `;
}

function renderProgressChart(results, avgPercent) {
  const wrap = document.getElementById('progressChartWrap');
  if (!wrap || results.length === 0) return;
  const chrono = [...results].sort((a, b) => a.timestamp - b.timestamp);
  let runningSum = 0;
  const series = chrono.map((r, i) => {
    runningSum += (r.score / r.total) * 100;
    return { cumulativeAvg: runningSum / (i + 1), percent: (r.score / r.total) * 100, name: r.studentName };
  });

  wrap.innerHTML = `
    <div class="card" style="display:block; cursor:default;">
      <div style="font-size:15px; font-weight:800; margin-bottom:14px;">روند میانگین پیشرفت (تجمعی بر اساس ترتیب زمانی آزمون‌ها)</div>
      <div style="display:flex; align-items:flex-end; gap:4px; height:140px; overflow-x:auto; padding-bottom:6px;">
        ${series.map((p, i) => `
          <div title="${esc(p.name)}: ${p.percent.toFixed(0)}% (میانگین تجمعی تا این نفر: ${p.cumulativeAvg.toFixed(1)}%)" style="display:flex; flex-direction:column; align-items:center; gap:4px; min-width:22px;">
            <div style="width:16px; height:${Math.max(4, p.cumulativeAvg / 100 * 120)}px; background:var(--crescent); border-radius:3px;"></div>
            <div style="font-size:9px; color:var(--muted);">${i + 1}</div>
          </div>
        `).join('')}
      </div>
      <div style="font-size:12px; color:var(--muted); margin-top:10px;">
        هر ستون میانگین تجمعی نمرات تا آن لحظه را نشان می‌دهد. با نگه‌داشتن نشانگر روی هر ستون جزئیات دیده می‌شود.
      </div>
    </div>
  `;
}

function renderStatsCompare(results, avgPercent) {
  const byStudent = {};
  results.forEach(r => {
    const percent = (r.score / r.total) * 100;
    if (!byStudent[r.studentName]) {
      byStudent[r.studentName] = { name: r.studentName, attempts: 0, best: percent, last: percent, lastTs: r.timestamp, sum: 0 };
    }
    const rec = byStudent[r.studentName];
    rec.attempts++;
    rec.sum += percent;
    if (percent > rec.best) rec.best = percent;
    if (r.timestamp >= rec.lastTs) { rec.last = percent; rec.lastTs = r.timestamp; }
  });
  const studentRows = Object.values(byStudent)
    .map(s => ({ ...s, avg: s.sum / s.attempts, diffFromClassAvg: (s.sum / s.attempts) - avgPercent }))
    .sort((a, b) => b.avg - a.avg);

  if (studentRows.length === 0) {
    return `<div style="text-align:center; color:var(--muted); padding:40px 0;">هنوز کسی در آزمون شرکت نکرده است.</div>`;
  }

  const maxAvg = Math.max(...studentRows.map(s => s.avg), 100);

  return `
    <div class="card" style="cursor:default; font-size:13px; color:var(--muted); margin-bottom:16px;">
      میانگین کلاس: <b style="color:var(--ink);">${avgPercent.toFixed(1)}%</b> — دانش‌آموزان بر اساس میانگین نمرات (بهترین در بالا) رتبه‌بندی شده‌اند.
    </div>
    <div>
      ${studentRows.map((s, i) => {
        const barWidth = Math.max(3, (s.avg / maxAvg) * 100);
        const aboveAvg = s.diffFromClassAvg >= 0;
        const medalBg = i === 0 ? '#F4C542' : i === 1 ? '#C7CBD1' : i === 2 ? '#D8A265' : 'var(--sand-deep)';
        const medalColor = i <= 2 ? '#1a1210' : 'var(--muted)';
        return `
          <div class="qcard">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:${medalBg}; color:${medalColor}; border:${i > 2 ? '1.5px solid var(--border)' : 'none'}; font-size:12px; font-weight:900; flex-shrink:0;">${i + 1}</span>
                <span style="font-weight:700; font-size:14px;">${esc(s.name)}</span>
                <span style="font-size:11px; color:var(--muted);">(${s.attempts} آزمون)</span>
              </div>
              <div style="text-align:left;">
                <div style="font-size:15px; font-weight:900;">${s.avg.toFixed(1)}%</div>
                <div style="font-size:11px; color:${aboveAvg ? 'var(--good)' : 'var(--bad)'};">
                  ${aboveAvg ? '▲' : '▼'} ${Math.abs(s.diffFromClassAvg).toFixed(1)}٪ ${aboveAvg ? 'بالاتر از میانگین' : 'پایین‌تر از میانگین'}
                </div>
              </div>
            </div>
            <div style="height:10px; background:var(--sand-deep); border:1px solid var(--border); border-radius:5px; overflow:hidden;">
              <div style="height:100%; width:${barWidth}%; border-radius:5px; background:${s.avg >= 50 ? 'var(--good)' : 'var(--bad)'};"></div>
            </div>
            <div style="font-size:11px; color:var(--muted); margin-top:6px; display:flex; gap:12px;">
              <span>بهترین نمره: ${s.best.toFixed(0)}%</span>
              <span>آخرین نمره: ${s.last.toFixed(0)}%</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderStatsStudents(results, answerKey, avgPercent) {
  const sorted = [...results].sort((a, b) => b.timestamp - a.timestamp);
  if (sorted.length === 0) {
    return `<div style="text-align:center; color:var(--muted); padding:40px 0;">هنوز کسی در آزمون شرکت نکرده است.</div>`;
  }

  return `
    <div>
      ${sorted.map((r, i) => {
        const percent = Math.round((r.score / r.total) * 100);
        const isOpen = state.expandedStudent === i;
        const wrongItems = (r.perQuestion || []).filter(pq => !pq.correct);
        const diff = percent - avgPercent;
        return `
          <div class="qcard" style="padding:0; overflow:hidden;">
            <div style="padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleStudent(${i})">
              <div>
                <div style="font-weight:700; font-size:15px;">${esc(r.studentName)}</div>
                <div style="font-size:12px; color:var(--muted); margin-top:2px;">
                  ${new Date(r.timestamp).toLocaleString('fa-IR')} ${r.perQuestion ? `· ${wrongItems.length} پاسخ اشتباه` : ''}
                  ·
                  <span style="color:${diff >= 0 ? 'var(--good)' : 'var(--bad)'};">${diff >= 0 ? '+' : ''}${diff.toFixed(0)}٪ نسبت به میانگین کلاس</span>
                </div>
              </div>
              <div style="font-size:15px; font-weight:900; color:${percent >= 50 ? 'var(--good)' : 'var(--bad)'};">${r.score}/${r.total} (${percent}%)</div>
            </div>
            ${isOpen ? `
              <div style="border-top:1px solid var(--border); padding:12px 16px; background:var(--sand-deep);">
                ${!r.perQuestion ? `<div style="font-size:12px; color:var(--muted);">جزئیات سوالات برای این آزمون ثبت نشده (آزمون قدیمی).</div>` : ''}
                ${r.perQuestion && wrongItems.length === 0 ? `<div style="font-size:13px; color:var(--good); font-weight:700;">همه پاسخ‌ها صحیح بود 🎉</div>` : ''}
                ${r.perQuestion ? wrongItems.map((pq, j) => {
                  const q = QUESTIONS.find(x => x.id === pq.qid);
                  if (!q) return '';
                  return `
                    <div style="margin-bottom:10px; padding-bottom:10px; border-bottom:${j < wrongItems.length - 1 ? '1px solid var(--border)' : 'none'};">
                      <div style="font-size:13px; font-weight:700; margin-bottom:4px; line-height:1.7;">${esc(q.question)}</div>
                      <div style="font-size:12px; color:var(--bad);">پاسخ داده‌شده: ${LETTERS[pq.chosenIdx]} - ${esc(q.options[pq.chosenIdx])}</div>
                      <div style="font-size:12px; color:var(--good);">پاسخ صحیح: ${LETTERS[answerKey[q.id]]} - ${esc(q.options[answerKey[q.id]])}</div>
                    </div>
                  `;
                }).join('') : ''}
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function toggleStudent(i) {
  state.expandedStudent = state.expandedStudent === i ? null : i;
  render();
}

function renderStatsQuestions(results) {
  const questionStats = {};
  results.forEach(r => {
    if (!r.perQuestion) return;
    r.perQuestion.forEach(pq => {
      if (!questionStats[pq.qid]) questionStats[pq.qid] = { total: 0, wrong: 0, wrongBy: [] };
      questionStats[pq.qid].total++;
      if (!pq.correct) {
        questionStats[pq.qid].wrong++;
        questionStats[pq.qid].wrongBy.push({ student: r.studentName });
      }
    });
  });

  const rows = Object.entries(questionStats)
    .map(([qid, stat]) => {
      const q = QUESTIONS.find(x => x.id === qid);
      return { qid, q, ...stat, wrongRate: stat.total ? (stat.wrong / stat.total) * 100 : 0 };
    })
    .filter(r => r.total > 0)
    .sort((a, b) => b.wrongRate - a.wrongRate);

  if (rows.length === 0) {
    return `<div style="text-align:center; color:var(--muted); padding:40px 0;">هنوز داده‌ای برای تحلیل سوالات ثبت نشده است.</div>`;
  }

  return `
    <div>
      ${rows.map(row => `
        <div class="qcard">
          <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:6px;">
            <div style="font-size:13px; font-weight:700; line-height:1.7;">${esc(row.q ? row.q.question : row.qid)}</div>
            <div style="font-size:13px; font-weight:900; color:${row.wrongRate > 50 ? 'var(--bad)' : 'var(--muted)'}; white-space:nowrap;">
              ${row.wrong}/${row.total} اشتباه (${row.wrongRate.toFixed(0)}%)
            </div>
          </div>
          ${row.wrongBy.length > 0 ? `
            <div style="font-size:12px; color:var(--muted); margin-top:6px;">
              اشتباه‌کنندگان: ${row.wrongBy.map(w => esc(w.student)).join('، ')}
            </div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

/* ====================== BOOT ====================== */
init();
</script>
</body>
</html>
